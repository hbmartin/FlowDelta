strict: true
disabled_rules:
  - opening_brace
included:
  - Sources
  - Tests
  - Extensions
excluded:
  - .build
  - Extensions/FlowDeltaIndexStore/.build
  - Tests/FlowDeltaAnalysisTests/Fixtures
analyzer_rules:
  - unused_declaration
  - unused_import
opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - sorted_imports
  - static_operator
  - toggle_bool
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition
line_length:
  warning: 120
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true
file_length:
  warning: 650
function_body_length:
  warning: 90
cyclomatic_complexity:
  warning: 12
type_body_length:
  warning: 500
function_parameter_count:
  warning: 7
large_tuple:
  warning: 4
identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
