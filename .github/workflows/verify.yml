name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app
      - name: Install Mint
        run: brew install mint
      - name: Check formatting
        run: scripts/run_pinned_tool.sh swiftformat --lint .
      - name: Lint
        run: scripts/run_pinned_tool.sh swiftlint lint --strict
      - name: Test
        run: swift test
      - name: Test IndexStore extension
        run: swift test --package-path Extensions/FlowDeltaIndexStore
      - name: Coverage
        # xcodebuild passes only TEST_RUNNER_-prefixed variables to tests, so this is how they see CI=true and
        # skip the AppKit image snapshot, which is verified on the recording host.
        env:
          TEST_RUNNER_CI: "true"
        run: |
          mkdir -p build
          xcodebuild test \
            -scheme FlowDelta-Package \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath build/FlowDeltaCoverage.xcresult
          scripts/check_coverage.py build/FlowDeltaCoverage.xcresult
      - name: Release build
        run: swift build -c release
      - name: Release build IndexStore extension
        run: swift build --package-path Extensions/FlowDeltaIndexStore -c release
